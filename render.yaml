# Render Blueprint: one web service runs the FastAPI backend, which also serves the frontend.
# Deploy: Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: churn-risk-checker
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.3        # same Python version the model was trained with
